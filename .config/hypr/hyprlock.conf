background {
    monitor =
    path = ~/Pictures/wallpapers/cyberpunk-night.png
    blur_passes = 2
    blur_size = 6
    noise = 0.02
    contrast = 0.95
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

# top-left: session status
label {
    monitor =
    text = SESSION SUSPENDED
    color = rgba(eaeaeaff)
    font_family = JetBrains Mono
    font_size = 15
    position = 40, -42
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000099)
}

label {
    monitor =
    text = // ICE ACTIVE
    color = rgba(ff3355ee)
    font_family = JetBrains Mono
    font_size = 15
    position = 270, -42
    halign = left
    valign = top
}

# top-right: host / uplink
label {
    monitor =
    text = cmd[update:0] echo "HOST $(uname -n | tr a-z A-Z) // UPLINK ONLINE"
    color = rgba(eaeaeaff)
    font_family = JetBrains Mono
    font_size = 13
    position = -40, -42
    halign = right
    valign = top
}

label {
    monitor =
    text = PROFILE // CIRCUIT
    color = rgba(8a93a6cc)
    font_family = JetBrains Mono
    font_size = 12
    position = -40, -64
    halign = right
    valign = top
}

# center: big clock + seconds tick
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(eaeaeaff)
    font_family = JetBrains Mono
    font_size = 92
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(000000b0)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d" | tr a-z A-Z)"
    color = rgba(89dcebee)
    font_family = JetBrains Mono
    font_size = 20
    position = 0, -8
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000099)
}

label {
    monitor =
    text = cmd[update:0] echo "OPERATOR // $(whoami | tr a-z A-Z)"
    color = rgba(8a93a6cc)
    font_family = JetBrains Mono
    font_size = 13
    position = 0, -42
    halign = center
    valign = center
}

# auth box header
label {
    monitor =
    text = AUTH // PASSPHRASE
    color = rgba(eaeaeacc)
    font_family = JetBrains Mono
    font_size = 13
    position = 0, -95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 52
    position = 0, -155
    halign = center
    valign = center
    dots_center = true
    dots_size = 0.2
    dots_spacing = 0.4
    fade_on_empty = false
    rounding = 2
    outline_thickness = 2
    outer_color = rgba(ff3355ee)
    inner_color = rgba(0a0e14ee)
    font_color = rgba(eaeaeaee)
    placeholder_text = <i>ENTER PASSPHRASE TO RESUME SESSION</i>
    fail_text = <i>AUTH FAILED <b>($ATTEMPTS)</b></i>
    fail_color = rgba(ff3355ee)
    check_color = rgba(39ff88ee)
    capslock_color = rgba(ffcc00ee)
}

# bottom-left: status readout
label {
    monitor =
    text = cmd[update:5000] echo "PWR $(grep -q 1 /sys/class/power_supply/AC/online 2>/dev/null && echo AC || echo BAT) $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%  //  ICE NOMINAL"
    color = rgba(8a93a699)
    font_family = JetBrains Mono
    font_size = 12
    position = 40, 40
    halign = left
    valign = bottom
}

# bottom-right: uptime
label {
    monitor =
    text = cmd[update:60000] echo "UP $(uptime -p | sed 's/up //')"
    color = rgba(8a93a699)
    font_family = JetBrains Mono
    font_size = 12
    position = -40, 40
    halign = right
    valign = bottom
}
