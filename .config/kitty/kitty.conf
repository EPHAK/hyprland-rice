font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity 0.92
window_padding_width 8
confirm_os_window_close 0

# Catppuccin Mocha
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

active_border_color   #89B4FA
inactive_border_color #6C7086

# Close current tab (closes the window if it's the last tab, like a browser)
map ctrl+w close_tab

# Zoom font size, browser-style (Ctrl+Plus/Minus/0)
# This keyboard's +/- keys send numpad keysyms (kp_add/kp_subtract), not the
# standard ones, so both are mapped to be safe.
map ctrl+plus change_font_size all +2.0
map ctrl+equal change_font_size all +2.0
map ctrl+kp_add change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Jump to tab N (like browser tabs)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
